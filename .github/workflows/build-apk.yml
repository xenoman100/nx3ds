
name: Build NX3DS Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build NX3DS Vanilla ARM64 Release
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleVanillaRelease

      - name: Upload NX3DS APK
        uses: actions/upload-artifact@v4
        with:
          name: NX3DS-Vanilla-ARM64
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error
          retention-days: 7
